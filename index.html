<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim Tab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .sim-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 300px;
        }

        /* Glow effect container */
        .glow-effect {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* Sim Button */
        .sim-button {
            position: relative;
            z-index: 2;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #1a233a;
            border: 2px solid #224488;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .sim-button:hover {
            border-color: #3366cc;
            background-color: #222d4f;
        }

        /* Active State Classes */
        .sim-container.active .glow-effect {
            opacity: 1;
            animation: breathe 2s ease-in-out infinite alternate;
        }

        .sim-container.active .sim-button {
            background-color: #003333;
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* Breathing keyframes */
        @keyframes breathe {
            0% {
                transform: scale(0.9);
                opacity: 0.4;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

    <div class="sim-container" id="simContainer">
        <div class="glow-effect"></div>
        <button class="sim-button" id="simButton">Toggle Sim</button>
    </div>

    <script>
        const simContainer = document.getElementById('simContainer');
        const simButton = document.getElementById('simButton');

        let isActive = false;

        simButton.addEventListener('click', () => {
            isActive = !isActive;
            
            if (isActive) {
                simContainer.classList.add('active');
                simButton.textContent = 'Sim Active';
            } else {
                simContainer.classList.remove('active');
                simButton.textContent = 'Toggle Sim';
            }
        });
    </script>

</body>
</html>
